services:
  web:
    build: .
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 2s
    restart: unless-stopped
